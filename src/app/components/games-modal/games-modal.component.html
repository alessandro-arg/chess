<!-- Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-sm"
    (click)="close.emit()"
    aria-hidden="true"
  ></div>

  <!-- Panel -->
  <div
    class="relative w-full min-h-[400px] max-w-lg sm:max-w-xl bg-steel-secondary/70 border-l-4 border-steel-accent backdrop-blur rounded-xl shadow-2xl mx-4 sm:mx-0"
    role="dialog"
    aria-modal="true"
  >
    <!-- Header -->
    <div
      class="flex items-center justify-between px-4 sm:px-6 py-4 bg-gradient-to-r from-steel-secondary/50 to-steel-bg/30 border-b border-steel-primary/20"
    >
      <h3 class="text-white font-semibold text-base sm:text-lg">
        All Recent Games
      </h3>
      <button
        type="button"
        class="p-2 rounded-lg text-steel-accent hover:text-steel-primary hover:bg-steel-bg/30 focus:outline-none focus:ring-2 focus:ring-steel-accent"
        aria-label="Close"
        (click)="close.emit()"
      >
        ✕
      </button>
    </div>

    <!-- Body -->
    <div class="px-4 pr-0 sm:px-6 sm:pr-0 py-4 max-h-[70vh] overflow-y-auto">
      <ng-container *ngIf="vm$ | async as vm; else loading">
        <div *ngIf="vm.error" class="text-sm text-red-400 px-1 py-2">
          {{ vm.error }}
        </div>

        <div class="max-h-[400px] overflow-y-auto space-y-3">
          <div
            *ngIf="!vm.error && vm.items.length === 0"
            class="text-sm text-gray-400 px-1 py-2"
          >
            No games played yet.
          </div>

          <article
            *ngFor="let it of vm.items; trackBy: trackById"
            class="mr-4 flex items-center justify-between p-3 bg-steel-bg/30 hover:bg-steel-bg/50 rounded-lg transition-colors"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-8 h-8 rounded-lg flex items-center justify-center"
                [ngClass]="it.boxClass"
              >
                <span class="text-sm font-bold" [ngClass]="it.textClass">{{
                  it.outcome
                }}</span>
              </div>

              <div>
                <p class="text-sm font-medium text-white">
                  vs {{ it.opponentLabel }}
                </p>
                <div
                  class="flex items-center gap-2 text-xs text-gray-400 flex-wrap"
                >
                  <!-- Mode -->
                  <span>
                    {{ it.tcLabel }}
                  </span>
                  <span class="text-gray-400">•</span>

                  <!-- Friendly win condition -->
                  <span>
                    {{ it.statusLabel }}
                  </span>
                  <span class="text-gray-400">•</span>

                  <!-- Color -->
                  <span>
                    {{ it.colorLabel }}
                  </span>
                  <span class="text-gray-400">•</span>

                  <!-- Time ago -->
                  <span class="text-gray-400">{{ it.whenLabel }}</span>
                </div>
              </div>
            </div>
          </article>
        </div>
      </ng-container>

      <ng-template #loading>
        <div class="text-sm text-gray-400 px-1 py-2">Loading…</div>
      </ng-template>
    </div>
  </div>
</div>
